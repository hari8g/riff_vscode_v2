name: eval

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      claude:
        description: Also run Claude Code headless (spends API credit)
        type: boolean
        default: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: Localisation eval (free)
        run: node packages/cli/dist/main.js eval --runner scripted,compiler,compiler+history --quiet --out reports/eval
      - name: Regression gate (recall -2 pts / tokens +10%)
        run: node tooling/scripts/eval-gate.mjs reports/eval/report.json docs/eval/reference.json
      - name: Claude Code headless (baseline)
        if: ${{ inputs.claude && secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          node packages/cli/dist/main.js eval --runner claude --quiet --out reports/eval-claude
      - name: Job summary
        if: always()
        run: cat reports/eval/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/
