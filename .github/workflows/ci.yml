name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      # build, webview typecheck, lint (dependency boundaries), unit + fixture + golden-pack tests, schema drift
      - run: pnpm verify
        env:
          CI: 'true'
      - run: pnpm package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: riaf-vsix
          path: dist-bundle/*.vsix
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit
          path: reports/junit.xml
          if-no-files-found: ignore
