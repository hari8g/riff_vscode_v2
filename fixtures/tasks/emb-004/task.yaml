id: emb-004
repo: embedded-c
intent: feature
request: Add ring_peek(const ring_t *r, uint8_t *byte) that returns the next byte without removing it (0 on success, -1 when empty).
ide: {}
gold_files: [include/ring.h, src/ring.c]
gold_symbols: ["src/ring.c#ring_pop@function", "include/ring.h#ring_pop@function"]
setup: []
gold:
  - path: include/ring.h
    find: "int ring_pop(ring_t *r, uint8_t *byte);"
    replace: "int ring_pop(ring_t *r, uint8_t *byte);\nint ring_peek(const ring_t *r, uint8_t *byte);"
  - path: src/ring.c
    find: "size_t ring_count(const ring_t *r) {"
    replace: |-
      /* Returns 0 and the next byte without removing it, -1 when empty. */
      int ring_peek(const ring_t *r, uint8_t *byte) {
          if (r->count == 0) {
              return -1;
          }
          *byte = r->data[r->tail];
          return 0;
      }

      size_t ring_count(const ring_t *r) {
hidden:
  - path: test/hidden_peek.c
    content: |
      #include <assert.h>
      #include "ring.h"
      int main(void) {
          ring_t r;
          ring_init(&r);
          uint8_t b;
          assert(ring_peek(&r, &b) == -1);
          ring_push(&r, 7);
          assert(ring_peek(&r, &b) == 0 && b == 7);
          assert(ring_count(&r) == 1);
          return 0;
      }
test: { kind: cc, files: [test/hidden_peek.c], sources: [src/ring.c] }
