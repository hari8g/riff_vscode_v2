id: tel-005
repo: telemetry-py
intent: feature
request: Config.from_env should reject a TELEMETRY_BUFFER that is zero or negative with a ValueError instead of failing later in the ring buffer.
ide: {}
gold_files: [src/telemetry/config.py]
gold_symbols: ["src/telemetry/config.py#Config.from_env@method"]
setup: []
gold:
  - path: src/telemetry/config.py
    find: "        env = os.environ if env is None else env\n        return cls(\n            buffer_size=int(env.get(\"TELEMETRY_BUFFER\", DEFAULT_BUFFER_SIZE)),"
    replace: "        env = os.environ if env is None else env\n        buffer_size = int(env.get(\"TELEMETRY_BUFFER\", DEFAULT_BUFFER_SIZE))\n        if buffer_size <= 0:\n            raise ValueError(\"TELEMETRY_BUFFER must be positive\")\n        return cls(\n            buffer_size=buffer_size,"
hidden:
  - path: tests/hidden/test_config.py
    content: |
      import pytest

      from telemetry.config import Config


      def test_rejects_non_positive_buffer():
          with pytest.raises(ValueError):
              Config.from_env({"TELEMETRY_BUFFER": "0"})


      def test_accepts_positive_buffer():
          assert Config.from_env({"TELEMETRY_BUFFER": "16"}).buffer_size == 16
test: { kind: pytest, files: [tests/hidden/test_config.py] }
