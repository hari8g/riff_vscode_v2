      package com.fleet.dispatch;
      import com.fleet.model.*;
      public class HiddenFleet003 {
          public static void main(String[] a) {
              InMemoryVehicleRepository repo = new InMemoryVehicleRepository();
              Vehicle m = new Vehicle("m", new GeoPoint(1, 1), 4);
              m.sendToMaintenance();
              repo.save(m);
              repo.save(new Vehicle("a", new GeoPoint(1, 1), 4));
              if (repo.countByStatus(VehicleStatus.MAINTENANCE) != 1) throw new AssertionError("maintenance count");
