      package com.fleet.dispatch;
      import com.fleet.model.*;
      public class HiddenFleet002 {
          public static void main(String[] a) {
              InMemoryVehicleRepository repo = new InMemoryVehicleRepository();
              Vehicle v = new Vehicle("v", new GeoPoint(1, 1), 4);
              repo.save(v);
              DispatchService s = new DispatchService(repo, new NearestVehiclePolicy(50));
              Trip t = new Trip("t", new GeoPoint(1, 1), new GeoPoint(2, 2), 1);
              s.assign(t);
              s.complete(t);
              if (v.getStatus() != VehicleStatus.AVAILABLE) throw new AssertionError("vehicle not released");
          }
