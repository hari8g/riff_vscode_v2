id: emb-003
repo: embedded-c
intent: bugfix
request: The receiver rejects our frames. The frame CRC must be sent big-endian (high byte first) after the payload.
ide: {}
gold_files: [src/uart.c]
gold_symbols: ["src/uart.c#uart_send_frame@function"]
setup:
  - path: src/uart.c
    find: "uint8_t tail[2] = {(uint8_t)(crc >> 8), (uint8_t)(crc & 0xFF)};"
    replace: "uint8_t tail[2] = {(uint8_t)(crc & 0xFF), (uint8_t)(crc >> 8)};"
gold:
  - path: src/uart.c
    find: "uint8_t tail[2] = {(uint8_t)(crc & 0xFF), (uint8_t)(crc >> 8)};"
    replace: "uint8_t tail[2] = {(uint8_t)(crc >> 8), (uint8_t)(crc & 0xFF)};"
hidden:
  - path: test/hidden_frame.c
    content: |
      #include <assert.h>
      #include "crc.h"
      #include "uart.h"
      int main(void) {
          uart_t u;
          uart_init(&u, 0);
          const uint8_t p[] = {'1', '2', '3', '4', '5', '6', '7', '8', '9'};
          assert(uart_send_frame(&u, p, 9) == 2);
          uart_poll(&u);
          uint8_t b;
          for (int i = 0; i < 9; i++) uart_read(&u, &b);
          uint8_t hi, lo;
          uart_read(&u, &hi);
          uart_read(&u, &lo);
          assert(hi == 0x29 && lo == 0xB1);
          return 0;
      }
test: { kind: cc, files: [test/hidden_frame.c], sources: [src/uart.c, src/ring.c, src/crc.c, src/hal_stub.c] }
